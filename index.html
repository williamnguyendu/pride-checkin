<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pride Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800 font-sans">

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center hidden">
        <div class="loader mb-4"></div>
        <p class="text-gray-600 font-medium">Đang xử lý dữ liệu...</p>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">Pride Check-In</h1>
        <button onclick="openSettings()" class="text-gray-500 hover:text-blue-600 transition">
            <i class="fas fa-cog text-2xl"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-lg mx-auto">
        <!-- Trạng thái chưa chọn sự kiện -->
        <div id="no-event" class="text-center">
            <i class="fas fa-calendar-times text-6xl text-gray-300 mb-4"></i>
            <h2 class="text-xl font-semibold text-gray-700">Chưa chọn sự kiện</h2>
            <p class="text-gray-500 mt-2">Vui lòng chọn Sự kiện trong phần Cài đặt để bắt đầu.</p>
            <button onclick="openSettings()" class="mt-6 bg-blue-100 text-blue-600 px-6 py-2 rounded-full font-medium hover:bg-blue-200 transition">Mở Cài Đặt</button>
        </div>

        <!-- Trạng thái đã chọn sự kiện -->
        <div id="active-event" class="w-full bg-white rounded-2xl shadow-lg p-6 text-center hidden">
            <div class="inline-block p-4 bg-blue-50 rounded-full mb-4">
                <i class="fas fa-qrcode text-4xl text-blue-600"></i>
            </div>
            <h2 id="ev-name" class="text-2xl font-bold text-gray-800 mb-2">Tên Sự Kiện</h2>
            <div class="text-left bg-gray-50 p-4 rounded-lg mb-6 space-y-2 text-sm">
                <p><i class="far fa-calendar-alt w-5 text-gray-500"></i> <span id="ev-date" class="font-medium"></span></p>
                <p><i class="far fa-clock w-5 text-gray-500"></i> <span id="ev-time" class="font-medium"></span></p>
                <p><i class="fas fa-map-marker-alt w-5 text-gray-500"></i> <span id="ev-location" class="font-medium"></span></p>
            </div>
            <button onclick="startScanner()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition transform hover:scale-[1.02] text-lg">
                BẮT ĐẦU CHECK-IN
            </button>
        </div>
    </main>

    <!-- Scanner View -->
    <div id="scanner-view" class="fixed inset-0 bg-black z-40 flex flex-col hidden">
        <div class="p-4 flex justify-between items-center bg-black text-white">
            <h3 class="text-lg font-bold">Quét QR Code Vé</h3>
            <button onclick="stopScanner()" class="text-white bg-gray-800 p-2 rounded-full hover:bg-gray-700"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="flex-grow flex items-center justify-center">
            <div id="reader" class="w-full max-w-md bg-black"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-11/12 max-w-md">
            <h3 class="text-xl font-bold mb-4">Cài Đặt Sự Kiện</h3>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Chọn sự kiện đang diễn ra:</label>
                <select id="event-select" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"></select>
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeSettings()" class="px-4 py-2 text-gray-500 hover:text-gray-700 font-medium">Hủy</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Lưu</button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center hidden">
        <div id="result-content" class="bg-white rounded-2xl p-8 w-11/12 max-w-sm text-center transform transition-all">
            <div id="result-icon" class="text-6xl mb-4"></div>
            <h3 id="result-title" class="text-2xl font-bold mb-2"></h3>
            <div id="result-details" class="text-gray-600 text-lg mb-6"></div>
            <button onclick="closeResult()" class="w-full bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200">Đóng</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center mt-auto">
        <p class="text-sm text-gray-500">Pride Check-In được xây dựng bởi <a href="https://www.pridehome.vn" target="_blank" class="text-blue-600 hover:underline font-semibold">Pride Home</a>.</p>
    </footer>

    <script>
        // --- CẤU HÌNH API URL ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyyZFy_NGNeiMem6J6TCK9XzifJfEPDDpqTvroRgzCkrOLZ1XMWVk554hKLTqtiG0Vk/exec"; 
        
        let html5QrcodeScanner = null;
        let activeEvent = JSON.parse(localStorage.getItem('pride_active_event')) || null;
        let eventList = [];
        let autoCloseTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            updateMainUI();
        });

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        async function fetchEvents() {
            showLoading(true);
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEvents`);
                const json = await res.json();
                if(json.status === 'success') {
                    eventList = json.data;
                    const select = document.getElementById('event-select');
                    select.innerHTML = '';
                    eventList.forEach(ev => {
                        const opt = document.createElement('option');
                        opt.value = ev.id;
                        opt.textContent = ev.name;
                        if(activeEvent && activeEvent.id === ev.id) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                alert("Lỗi khi tải danh sách sự kiện: " + err);
            }
            showLoading(false);
        }

        async function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            if(eventList.length === 0) await fetchEvents();
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const select = document.getElementById('event-select');
            if(select.value) {
                const selected = eventList.find(e => e.id === select.value);
                localStorage.setItem('pride_active_event', JSON.stringify(selected));
                activeEvent = selected;
                updateMainUI();
            }
            closeSettings();
        }

        function updateMainUI() {
            const noEv = document.getElementById('no-event');
            const activeEv = document.getElementById('active-event');
            
            if (activeEvent) {
                noEv.classList.add('hidden');
                activeEv.classList.remove('hidden');
                document.getElementById('ev-name').textContent = activeEvent.name;
                document.getElementById('ev-date').textContent = activeEvent.date;
                document.getElementById('ev-time').textContent = activeEvent.time;
                document.getElementById('ev-location').textContent = activeEvent.location;
            } else {
                noEv.classList.remove('hidden');
                activeEv.classList.add('hidden');
            }
        }

        function startScanner() {
            document.getElementById('scanner-view').classList.remove('hidden');
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                (errorMessage) => {} // Bỏ qua lỗi scan liên tục
            ).catch(err => {
                alert("Không thể truy cập camera. Vui lòng cấp quyền.");
                stopScanner();
            });
        }

        function stopScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                }).catch(err => console.log(err));
            }
            document.getElementById('scanner-view').classList.add('hidden');
        }

        async function onScanSuccess(decodedText) {
            stopScanner();
            showLoading(true);
            
            try {
                const res = await fetch(`${WEB_APP_URL}?action=checkIn&eventId=${activeEvent.id}&qrCode=${encodeURIComponent(decodedText)}`);
                const result = await res.json();
                
                showLoading(false);
                showResult(result);
            } catch (err) {
                showLoading(false);
                showResult({ status: 'error', message: 'Lỗi kết nối. Vui lòng thử lại.' });
            }
        }

        function showResult(data) {
            const modal = document.getElementById('result-modal');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const details = document.getElementById('result-details');
            
            modal.classList.remove('hidden');
            clearTimeout(autoCloseTimer);

            if (data.status === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                title.textContent = 'Chào mừng';
                title.className = 'text-3xl font-bold mb-2 text-green-600';
                details.innerHTML = `<p class="font-bold text-xl text-gray-800">${data.data.hoTen}</p><p class="text-md mt-1">SĐT: ${data.data.sdt}</p>`;
                
                // Tự động đóng sau 5 giây nếu thành công
                autoCloseTimer = setTimeout(() => {
                    closeResult();
                }, 5000);
            } else {
                icon.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                title.textContent = 'Thất bại';
                title.className = 'text-3xl font-bold mb-2 text-red-600';
                details.innerHTML = `<p class="text-red-500 font-medium">${data.message}</p>`;
            }
        }

        function closeResult() {
            document.getElementById('result-modal').classList.add('hidden');
            clearTimeout(autoCloseTimer);
        }
    </script>
</body>
</html>
