<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pride Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Thêm thư viện pháo giấy Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Gradient Background sinh động */
        .bg-gradient-main { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        
        /* Hiệu ứng Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* Loading Animation hiện đại */
        .loader-ring {
            display: inline-block; width: 60px; height: 60px;
        }
        .loader-ring:after {
            content: " "; display: block; width: 48px; height: 48px; margin: 6px;
            border-radius: 50%; border: 4px solid #4f46e5;
            border-color: #4f46e5 transparent #4f46e5 transparent;
            animation: loader-ring 1.2s linear infinite;
        }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Animation bật lên cho Modal */
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .hidden { display: none !important; }
        
        /* Tùy chỉnh khung camera trong html5-qrcode */
        #reader { border: none !important; border-radius: 1rem; overflow: hidden; }
        #reader video { object-fit: cover !important; }
    </style>
</head>
<body class="bg-gradient-main flex flex-col min-h-screen text-gray-800">

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
        <div class="loader-ring mb-2"></div>
        <p class="text-indigo-600 font-bold text-lg tracking-wide animate-pulse">Đang đồng bộ dữ liệu...</p>
    </div>

    <!-- Header -->
    <header class="bg-white/40 backdrop-blur-md px-6 py-4 flex justify-between items-center sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i class="fas fa-ticket-alt text-xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-indigo-900 tracking-tight">Pride<span class="text-indigo-600">CheckIn</span></h1>
        </div>
        <button onclick="openSettings()" class="bg-white p-2 rounded-full shadow-sm text-indigo-600 hover:text-white hover:bg-indigo-600 transition-all duration-300">
            <i class="fas fa-cog text-xl w-6 h-6 flex items-center justify-center"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 w-full max-w-md mx-auto z-10">
        
        <!-- Trạng thái chưa chọn sự kiện -->
        <div id="no-event" class="glass-card w-full rounded-3xl p-8 text-center hidden pop-in">
            <div class="inline-block p-5 bg-indigo-100 rounded-full mb-4">
                <i class="fas fa-calendar-plus text-5xl text-indigo-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Bắt đầu nào!</h2>
            <p class="text-gray-500 mt-2 mb-6">Bạn cần cấu hình sự kiện đang diễn ra để tiến hành đón khách.</p>
            <button onclick="openSettings()" class="w-full bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 hover:shadow-lg transition-all">
                Cài đặt sự kiện ngay
            </button>
        </div>

        <!-- Trạng thái đã chọn sự kiện -->
        <div id="active-event" class="glass-card w-full rounded-3xl p-6 text-center hidden pop-in">
            <div class="relative inline-block mb-2">
                <div class="absolute -inset-1 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full blur opacity-40"></div>
                <div class="relative bg-white p-4 rounded-full">
                    <i class="fas fa-qrcode text-4xl text-indigo-600"></i>
                </div>
            </div>
            
            <h2 id="ev-name" class="text-2xl font-extrabold text-gray-900 mt-3 mb-4 leading-tight">Tên Sự Kiện</h2>
            
            <div class="text-left bg-white/60 p-4 rounded-2xl mb-6 space-y-3 shadow-inner">
                <div class="flex items-center text-gray-700">
                    <div class="bg-indigo-100 p-2 rounded-lg mr-3"><i class="far fa-calendar-check text-indigo-600"></i></div>
                    <span id="ev-date" class="font-semibold text-lg"></span>
                </div>
                <div class="flex items-center text-gray-700">
                    <div class="bg-indigo-100 p-2 rounded-lg mr-3"><i class="far fa-clock text-indigo-600"></i></div>
                    <span id="ev-time" class="font-semibold text-lg"></span>
                </div>
                <div class="flex items-center text-gray-700">
                    <div class="bg-indigo-100 p-2 rounded-lg mr-3"><i class="fas fa-map-marker-alt text-indigo-600"></i></div>
                    <span id="ev-location" class="font-semibold text-md"></span>
                </div>
            </div>

            <button onclick="startScanner()" class="relative w-full group">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-2xl blur opacity-70 group-hover:opacity-100 transition duration-200"></div>
                <div class="relative w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 rounded-2xl shadow-xl flex items-center justify-center gap-2 text-xl hover:scale-[1.02] transition-transform">
                    <i class="fas fa-camera"></i> QUÉT VÉ NGAY
                </div>
            </button>
        </div>
    </main>

    <!-- Scanner View -->
    <div id="scanner-view" class="fixed inset-0 bg-gray-900 z-40 flex flex-col hidden">
        <div class="px-6 py-4 flex justify-between items-center bg-gray-900 text-white shadow-md z-50">
            <h3 class="text-xl font-bold tracking-wide"><i class="fas fa-qrcode mr-2"></i>Di chuyển QR vào khung</h3>
            <button onclick="stopScanner()" class="bg-gray-700/50 p-2 px-4 rounded-full hover:bg-red-500 transition-colors">
                <i class="fas fa-times mr-1"></i> Đóng
            </button>
        </div>
        <div class="flex-grow flex items-center justify-center bg-black w-full h-full p-4">
            <!-- Khung reader sẽ tự động to ra -->
            <div id="reader" class="w-full max-w-lg shadow-2xl bg-black rounded-2xl"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl p-6 w-11/12 max-w-sm pop-in">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-extrabold text-gray-800">Cấu hình Check-in</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-2xl"></i></button>
            </div>
            <div class="mb-6">
                <label class="block text-gray-600 text-sm font-semibold mb-2">Chọn sự kiện đang diễn ra</label>
                <div class="relative">
                    <select id="event-select" class="w-full border-2 border-indigo-100 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 bg-gray-50 text-gray-800 font-medium appearance-none transition-colors"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-indigo-500">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>
            <button onclick="saveSettings()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold text-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
                Lưu cài đặt
            </button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-gray-900/70 backdrop-blur-md z-50 flex items-center justify-center hidden">
        <div id="result-content" class="bg-white rounded-3xl p-8 w-11/12 max-w-sm text-center shadow-2xl pop-in">
            <div id="result-icon" class="text-7xl mb-4"></div>
            <h3 id="result-title" class="text-3xl font-extrabold mb-2"></h3>
            <div id="result-details" class="text-gray-600 text-lg mb-8 bg-gray-50 p-4 rounded-2xl"></div>
            <button onclick="closeResult()" id="btn-close-result" class="w-full font-bold py-3 rounded-xl transition-all text-lg"></button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white/30 backdrop-blur-md py-4 text-center mt-auto z-10 border-t border-white/20">
        <p class="text-sm text-gray-700 font-medium">Pride Check-In được xây dựng bởi <a href="https://www.pridehome.vn" target="_blank" class="text-indigo-700 hover:text-indigo-900 font-bold hover:underline">Pride Home</a>.</p>
    </footer>

    <script>
        // --- ĐIỀN URL WEB APP CỦA BẠN VÀO ĐÂY ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbynArNEtInLs9U4OnGCqLrHQFlv_Lsh-AWusNmVEJnJNMcsy0iPlArlZSlo00d1h3ws/exec"; 
        
        let html5QrcodeScanner = null;
        let activeEvent = JSON.parse(localStorage.getItem('pride_active_event')) || null;
        let eventList = [];
        let autoCloseTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            updateMainUI();
        });

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        async function fetchEvents() {
            showLoading(true);
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getEvents`);
                const json = await res.json();
                if(json.status === 'success') {
                    eventList = json.data;
                    const select = document.getElementById('event-select');
                    select.innerHTML = '';
                    eventList.forEach(ev => {
                        const opt = document.createElement('option');
                        opt.value = ev.id;
                        opt.textContent = ev.name;
                        if(activeEvent && activeEvent.id === ev.id) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                alert("Lỗi khi tải danh sách sự kiện: " + err);
            }
            showLoading(false);
        }

        async function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            if(eventList.length === 0) await fetchEvents();
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const select = document.getElementById('event-select');
            if(select.value) {
                const selected = eventList.find(e => e.id === select.value);
                localStorage.setItem('pride_active_event', JSON.stringify(selected));
                activeEvent = selected;
                updateMainUI();
            }
            closeSettings();
        }

        function updateMainUI() {
            const noEv = document.getElementById('no-event');
            const activeEv = document.getElementById('active-event');
            
            if (activeEvent) {
                noEv.classList.add('hidden');
                activeEv.classList.remove('hidden');
                document.getElementById('ev-name').textContent = activeEvent.name;
                document.getElementById('ev-date').textContent = activeEvent.date;
                document.getElementById('ev-time').textContent = activeEvent.time;
                document.getElementById('ev-location').textContent = activeEvent.location;
            } else {
                noEv.classList.remove('hidden');
                activeEv.classList.add('hidden');
            }
        }

        function startScanner() {
            document.getElementById('scanner-view').classList.remove('hidden');
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            // Tính toán kích thước khung quét to lên (80% chiều rộng màn hình, tối đa 400px)
            const boxSize = Math.min(window.innerWidth * 0.8, 400);

            const config = { 
                fps: 15, 
                qrbox: { width: boxSize, height: boxSize },
                aspectRatio: 1.0 
            };
            
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                (errorMessage) => {} 
            ).catch(err => {
                alert("Không thể truy cập camera. Vui lòng cấp quyền.");
                stopScanner();
            });
        }

        function stopScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                }).catch(err => console.log(err));
            }
            document.getElementById('scanner-view').classList.add('hidden');
        }

        async function onScanSuccess(decodedText) {
            stopScanner();
            showLoading(true);
            
            try {
                const res = await fetch(`${WEB_APP_URL}?action=checkIn&eventId=${activeEvent.id}&qrCode=${encodeURIComponent(decodedText)}`);
                const result = await res.json();
                
                showLoading(false);
                showResult(result);
            } catch (err) {
                showLoading(false);
                showResult({ status: 'error', message: 'Lỗi kết nối mạng. Vui lòng thử lại.' });
            }
        }

        // Bắn pháo giấy Confetti
        function fireConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#4f46e5', '#8b5cf6', '#3b82f6']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#4f46e5', '#8b5cf6', '#3b82f6']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function showResult(data) {
            const modal = document.getElementById('result-modal');
            const contentBox = document.getElementById('result-content');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const details = document.getElementById('result-details');
            const btnClose = document.getElementById('btn-close-result');
            
            // Xóa animation cũ để trigger lại
            contentBox.classList.remove('pop-in');
            void contentBox.offsetWidth; // trigger reflow
            contentBox.classList.add('pop-in');
            
            modal.classList.remove('hidden');
            clearTimeout(autoCloseTimer);

            if (data.status === 'success') {
                fireConfetti(); // Kích hoạt pháo giấy
                
                icon.innerHTML = '<i class="fas fa-check-circle text-green-500 animate-bounce"></i>';
                title.textContent = 'Thành công!';
                title.className = 'text-3xl font-extrabold mb-2 text-green-600';
                details.innerHTML = `
                    <p class="text-sm text-gray-500 mb-1">Khách mời</p>
                    <p class="font-extrabold text-2xl text-gray-900">${data.data.hoTen}</p>
                    <p class="text-md mt-2 font-medium text-gray-600"><i class="fas fa-phone-alt text-gray-400 mr-2"></i>${data.data.sdt}</p>
                `;
                
                btnClose.textContent = "Đóng (5s)";
                btnClose.className = "w-full bg-green-100 text-green-700 font-bold py-3 rounded-xl hover:bg-green-200 transition-all text-lg";

                let timeLeft = 5;
                autoCloseTimer = setInterval(() => {
                    timeLeft -= 1;
                    if (timeLeft <= 0) {
                        closeResult();
                    } else {
                        btnClose.textContent = `Đóng (${timeLeft}s)`;
                    }
                }, 1000);

            } else {
                icon.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                title.textContent = 'Vé không hợp lệ';
                title.className = 'text-3xl font-extrabold mb-2 text-red-600';
                details.innerHTML = `<p class="text-red-500 font-semibold text-center">${data.message}</p>`;
                
                btnClose.textContent = "Thử quét lại";
                btnClose.className = "w-full bg-red-100 text-red-700 font-bold py-3 rounded-xl hover:bg-red-200 transition-all text-lg";
            }
        }

        function closeResult() {
            document.getElementById('result-modal').classList.add('hidden');
            clearInterval(autoCloseTimer);
        }
    </script>
</body>
</html>
